<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Рыцари на двоих — кооперативная игра для Яндекс Игр. Убивайте зомби-рыцарей и скелетов, собирайте монеты, платите воротам и победите босса Шрека!">
<title>Рыцари на двоих — Проклятые земли</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#070a12;-webkit-user-select:none;user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#070a12}
  canvas{image-rendering:auto;touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<script>
'use strict';
/* =================== КОНСТАНТЫ =================== */
var W=1280,H=720,WORLD_W=1760,WORLD_H=990;
var BASE_COINS=120,COIN_GROWTH=1.10,TOLL_RATE=0.60;
var BASE_MONSTERS=6,MONSTER_GROWTH=1.20;
var REGULAR_LEVELS=5,BOSS_LEVEL=REGULAR_LEVELS+1;
var DT_MAX=0.033,TAU=Math.PI*2;
var K={W:'KeyW',A:'KeyA',S:'KeyS',D:'KeyD',F:'KeyF',G:'KeyG',H:'KeyH',
  UP:'ArrowUp',DOWN:'ArrowDown',LEFT:'ArrowLeft',RIGHT:'ArrowRight',
  PATT:'Period',PBLK:'Comma',PPICK:'Quote',
  ENTER:'Enter',ESC:'Escape',SPACE:'Space',
  K1:'Digit1',K2:'Digit2',K3:'Digit3',K4:'Digit4',K5:'Digit5',K6:'Digit6',K7:'Digit7',K8:'Digit8'};

/* =================== УТИЛИТЫ =================== */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rand(a,b){return a+Math.random()*(b-a);}
function irand(a,b){return Math.floor(rand(a,b+1));}
function ease(t){return t<0?0:(t>1?1:t*t*(3-2*t));}
function xdist(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill();}
function poly(px,py,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(px[0],py[0]);for(var i=1;i<px.length;i++)ctx.lineTo(px[i],py[i]);ctx.closePath();ctx.fill();}
function rounded(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);
  ctx.fill();
}
function txt(s,x,y,size,col,align,shadow){
  var sh=shadow||0;
  if(sh)ctx.shadowColor='rgba(0,0,0,0.7)';
  ctx.shadowBlur=sh;
  ctx.font=size+'px "Segoe UI",Arial,sans-serif';
  ctx.fillStyle=col;
  ctx.textAlign=align||'center';
  ctx.textBaseline='top';
  ctx.fillText(s,x,y);
  ctx.shadowBlur=0;
}

/* =================== ВВОД =================== */
var keys={},presses=[],mx=0,my=0,mclick=false;
function kc(e){return e.code?e.code:'';}
window.addEventListener('keydown',function(e){
  var c=kc(e);
  if(!keys[c])presses.push(c);
  keys[c]=true;
  var k=String(e.key||'').toLowerCase();
  if(k==='ю'||k==='.'){if(!keys[K.PATT])presses.push(K.PATT);keys[K.PATT]=true;}
  if(k==='б'||k===','){if(!keys[K.PBLK])presses.push(K.PBLK);keys[K.PBLK]=true;}
  if(k==="'"||k==='э'){if(!keys[K.PPICK])presses.push(K.PPICK);keys[K.PPICK]=true;}
  if(c===K.UP||c===K.DOWN||c===K.LEFT||c===K.RIGHT||c===K.SPACE)e.preventDefault();
});
window.addEventListener('keyup',function(e){
  var c=kc(e);keys[c]=false;
  var k=String(e.key||'').toLowerCase();
  if(k==='ю'||k==='.')keys[K.PATT]=false;
  if(k==='б'||k===',')keys[K.PBLK]=false;
  if(k==="'"||k==='э')keys[K.PPICK]=false;
});
function held(c){return !!keys[c];}
function took(c){var i=presses.indexOf(c);if(i>=0){presses.splice(i,1);return true;}return false;}
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
canvas.addEventListener('mousemove',function(e){
  var r=canvas.getBoundingClientRect();
  if(r.width>0){mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height;}
});
canvas.addEventListener('mousedown',function(e){mclick=true;canvas.focus();});
function fitCanvas(){
  var s=Math.min(window.innerWidth/W,window.innerHeight/H);
  canvas.style.width=Math.floor(W*s)+'px';
  canvas.style.height=Math.floor(H*s)+'px';
}
window.addEventListener('resize',fitCanvas);fitCanvas();
/* Режим демо-бота для автотеста (?demo) */
var DEMO=/[?&]demo/.test(location.search||'');
/* =================== АУДИО =================== */
var SND=(function(){
  var ac=null;
  function init(){if(ac)return;try{var C=window.AudioContext||window.AudioContext;if(C)ac=new C();}catch(e){}}
  function beep(f,d,v,t,delay){
    init();
    if(!ac||!v)return;
    try{
      var t0=ac.currentTime+(delay||0);
      var o=ac.createOscillator(),g=ac.createGain();
      o.type=t||'square';o.frequency.value=f;g.gain.value=v;
      o.connect(g);g.connect(ac.destination);
      o.start(t0);o.stop(t0+d);
    }catch(e){}
  }
  return {
    coin:function(){beep(1150,0.05,0.14,'square');beep(1600,0.08,0.14,'square',0.05);},
    swing:function(){beep(200,0.07,0.08,'triangle');},
    hit:function(){beep(130,0.08,0.2,'sawtooth');beep(75,0.1,0.14,'square',0.03);},
    block:function(){beep(430,0.06,0.16,'square');},
    pickup:function(){beep(650,0.06,0.14,'square');beep(870,0.06,0.14,'square',0.06);beep(1050,0.12,0.14,'square',0.12);},
    pay:function(){beep(392,0.1,0.15,'square');beep(523,0.1,0.15,'square',0.12);beep(659,0.18,0.16,'square',0.22);},
    buy:function(){beep(700,0.07,0.15,'square');beep(980,0.1,0.15,'square',0.07);},
    error:function(){beep(170,0.12,0.16,'sawtooth');},
    dead:function(){beep(300,0.25,0.2,'sawtooth');beep(150,0.5,0.2,'sawtooth',0.22);},
    potion:function(){beep(500,0.08,0.14,'sine');beep(760,0.12,0.14,'sine',0.1);},
    roar:function(){beep(85,0.7,0.28,'sawtooth');beep(60,0.7,0.22,'square',0.12);},
    bomb:function(){beep(90,0.5,0.28,'sawtooth');},
    fanfare:function(){[523,659,784,1047].forEach(function(f,i){beep(f,0.3,0.18,'square',i*0.18);});}
  };
})();

/* =================== СОСТОЯНИЕ ИГРЫ =================== */
var G=null;
function makePlayer(id){
  return {id:id,x:0,y:0,dir:1,vx:0,vy:0,moving:false,aim:0,
    hp:100,maxHp:100,speed:250,swingT:1,hitDone:true,blocking:false,
    down:false,downT:0,reviveT:0,inv:0,flash:0,walk:0,
    weaponTier:1,armorTier:0,shieldTier:0,levelCoins:0};
}
function newGame(){
  G={players:[makePlayer(0),makePlayer(1)],monsters:[],coins:[],pickups:[],projectiles:[],
     particles:[],floaters:[],obstacles:[],torches:[],grassPatches:[],gate:null,boss:null,
     level:1,isBoss:false,state:'banner',stateTimer:0,banner:'',bannerTimer:0,
     totalLevelCoins:0,collectedCoins:0,cleared:false,gateOpen:false,tollShown:false,
     toll:0,tollCollected:0,tollTimer:0,nextPurse:0,shopMsg:'',shopRects:[],shopContRect:null,
     purse:0,kills:0,time:0,cam:{x:0,y:0},shake:0,
     gameOverReason:'',ending:null,paused:false};
}
function P(){return G.players[0];}
function P2(){return G.players[1];}
function pwDamage(p){return 6+p.weaponTier*5;}
function armorBonus(t){return [0,25,50,80,120][t]||0;}
function armorRed(t){return [0,0.1,0.2,0.3,0.4][t]||0;}
function blockResist(p){return 0.55+Math.min(0.25,p.shieldTier*0.08);}
function syncMaxHp(p){p.maxHp=100+armorBonus(p.armorTier);if(p.hp>p.maxHp)p.hp=p.maxHp;}
/* =================== ГЕНЕРАЦИЯ УРОВНЯ =================== */
function posFree(pad){
  for(var i=0;i<50;i++){
    var x=rand(130,WORLD_W-130),y=rand(170,WORLD_H-130);
    var ok=true;
    for(var oi=0;oi<G.obstacles.length;oi++){var o=G.obstacles[oi];if(xdist(x,y,o.x,o.y)<o.r+50){ok=false;break;}}
    for(var pi=0;pi<G.players.length;pi++){var p=G.players[pi];if(xdist(x,y,p.x,p.y)<pad){ok=false;break;}}
    if(ok&&xdist(x,y,WORLD_W-150,WORLD_H/2)>140)return [x,y];
  }
  return [rand(350,WORLD_W-350),rand(300,WORLD_H-300)];
}
function buildObstacles(){
  G.obstacles=[];G.torches=[];G.grassPatches=[];
  var n=7+Math.min(12,G.level+2),tries=0;
  while(G.obstacles.length<n&&tries<400){
    tries++;
    var x=rand(140,WORLD_W-140),y=rand(190,WORLD_H-140);
    if(xdist(x,y,P().x,P().y)<300||xdist(x,y,P2().x,P2().y)<300)continue;
    if(xdist(x,y,WORLD_W-150,WORLD_H/2)<180)continue;
    var bad=false;
    for(var i=0;i<G.obstacles.length;i++){var o=G.obstacles[i];if(xdist(x,y,o.x,o.y)<o.r+110){bad=true;break;}}
    if(bad)continue;
    var t=Math.random();
    G.obstacles.push({x:x,y:y,r:t<0.42?24:(t<0.75?34:26),type:t<0.42?'tomb':(t<0.75?'tree':'pillar')});
  }
  var ts=[[130,170],[WORLD_W-130,170],[210,WORLD_H-120],[WORLD_W-300,WORLD_H-120],[WORLD_W-150,WORLD_H/2+250]];
  for(var ti=0;ti<ts.length;ti++)G.torches.push({x:ts[ti][0],y:ts[ti][1]});
  for(var gi=0;gi<85;gi++){
    G.grassPatches.push({x:rand(0,WORLD_W),y:rand(0,WORLD_H),rx:rand(20,70),ry:rand(12,40),c:Math.random()<0.5?'#44702c':'#56893c'});
  }
}
function spawnCoins(total){
  if(total<=0)return;
  var n=clamp(Math.round(18+G.level*3),24,110);
  var rem=total;
  for(var i=0;i<n;i++){
    var v=Math.max(1,Math.round(rem/(n-i)/5)*5);
    if(i===n-1)v=rem;
    rem-=v;
    var c=posFree(50);
    G.coins.push({x:c[0],y:c[1],v:v,t:rand(0,TAU),taken:false});
  }
}
function makeMonster(type,x,y,n){
  var hpS=1+(n-1)*0.18,dmgS=1+(n-1)*0.14;
  var m={type:type,x:x,y:y,face:-1,flash:0,dying:false,deadT:0,kx:0,ky:0,
    state:'idle',st:rand(0.3,0.9),cd:rand(0.4,1.2),cdMax:type==='knight'?1.1:2.0,
    aim:null,walk:0,moving:false,wind:0};
  if(type==='knight'){m.hp=44*hpS;m.maxHp=44*hpS;m.dmg=12*dmgS;m.speed=100;m.range=60;}
  else{m.hp=26*hpS;m.maxHp=26*hpS;m.dmg=9*dmgS;m.speed=122;m.range=260;}
  if(n>=BOSS_LEVEL){m.hp*=1.25;m.maxHp=m.hp;m.dmg*=1.2;}
  return m;
}
function buildLevel(){
  var p1=P(),p2=P2();
  p1.x=240;p1.y=WORLD_H-210;p2.x=340;p2.y=WORLD_H-210;
  p1.dir=1;p2.dir=1;p1.vx=p1.vy=p2.vx=p2.vy=0;
  p1.down=p2.down=false;p1.inv=1.4;p2.inv=1.4;p1.reviveT=p2.reviveT=0;
  p1.levelCoins=p2.levelCoins=0;
  syncMaxHp(p1);syncMaxHp(p2);
  G.monsters=[];G.coins=[];G.pickups=[];G.projectiles=[];G.particles=[];G.floaters=[];
  G.totalLevelCoins=G.isBoss?0:Math.round(BASE_COINS*Math.pow(COIN_GROWTH,G.level-1));
  G.collectedCoins=0;G.kills=0;G.cleared=false;G.gateOpen=false;G.tollShown=false;
  buildObstacles();
  if(!G.isBoss)spawnCoins(G.totalLevelCoins);
  var mc=G.isBoss?3:Math.round(BASE_MONSTERS*Math.pow(MONSTER_GROWTH,G.level-1));
  var knights=Math.round(mc*0.6),skels=mc-knights;
  for(var i=0;i<mc;i++){
    var type=i<knights?'knight':'skeleton';
    var c=posFree(320);
    G.monsters.push(makeMonster(type,c[0],c[1],G.level));
  }
  G.gate={x:WORLD_W-150,y:WORLD_H/2,raise:0};
  var mcx=(p1.x+p2.x)/2-W/2,mcy=(p1.y+p2.y)/2-H/2;
  G.cam.x=clamp(mcx,0,WORLD_W-W);
  G.cam.y=clamp(mcy,0,WORLD_H-H);
}
function makeBoss(){
  return {x:WORLD_W-430,y:WORLD_H/2,hp:850,maxHp:850,dmg:32,speed:82,
    face:-1,flash:0,dead:false,deadT:0,rage:false,bombCd:3.5,cd:1.2,cdMax:1.6,
    state:'chase',st:0,wind:0,aimT:null,walk:0,moving:true,type:'boss'};
}
function startLevel(n,isBoss){
  G.level=n;G.isBoss=isBoss;
  G.boss=isBoss?makeBoss():null;
  buildLevel();
  G.state='banner';G.stateTimer=isBoss?3.5:2.6;
  G.bannerTimer=G.stateTimer;
  G.banner=isBoss?'ФИНАЛ — БОСС ШРЕК!':'Уровень '+n;
  if(n===1)G.stateTimer=8;
  if(isBoss)SND.roar();
}
function burst(x,y,n,col,speed,size,grav,life){
  for(var i=0;i<n;i++){
    var a=rand(0,TAU),s=rand(speed*0.3,speed);
    G.particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(life*0.5,life),max:life,size:rand(size*0.5,size)*1.4,col:col[irand(0,col.length-1)],grav:grav||0});
  }
}
function addFloat(x,y,s,c){G.floaters.push({x:x,y:y,s:s,c:c,life:1});}
/* =================== ОТРИСОВКА МИРА =================== */
function drawGround(){
  ctx.fillStyle='#4d7d35';ctx.fillRect(0,0,WORLD_W,WORLD_H);
  for(var i=0;i<G.grassPatches.length;i++){var gp=G.grassPatches[i];ellipse(gp.x,gp.y,gp.rx,gp.ry,gp.c);}
  ctx.fillStyle='rgba(138,122,82,0.4)';
  for(var j=0;j<9;j++)ellipse(WORLD_W-40-j*28,WORLD_H/2,150+j*24,80+j*9,'rgba(138,122,82,0.28)');
}
function drawWalls(){
  var th=30;
  ctx.fillStyle='#6b7178';
  ctx.fillRect(0,0,WORLD_W,th);ctx.fillRect(0,WORLD_H-th,WORLD_W,th);
  ctx.fillRect(0,0,th,WORLD_H);ctx.fillRect(WORLD_W-th,0,th,WORLD_H);
  ctx.strokeStyle='#484d54';ctx.lineWidth=2;
  ctx.beginPath();
  for(var y=th;y<WORLD_H;y+=24){ctx.moveTo(th,y);ctx.lineTo(WORLD_W-th,y);}
  for(var x=th;x<WORLD_W;x+=36){ctx.moveTo(x,th);ctx.lineTo(x,WORLD_H-th);}
  ctx.stroke();
  ctx.fillStyle='#5c6168';
  for(var x2=0;x2<WORLD_W;x2+=46)ctx.fillRect(x2,0,26,14);
}
function drawTomb(o){
  ellipse(o.x,o.y+o.r+6,26,6,'rgba(0,0,0,0.3)');
  ctx.fillStyle='#9a9aa4';rounded(o.x-20,o.y-34,40,52,6);
  ctx.fillStyle='#85858f';rounded(o.x-15,o.y-30,30,44,4);
  ctx.fillStyle='#6f6f78';rounded(o.x-7,o.y-22,14,30,3);
  ctx.fillStyle='#7d7d88';ctx.fillRect(o.x-3,o.y-42,6,22);ctx.fillRect(o.x-10,o.y-37,20,6);
  ellipse(o.x-8,o.y-8,10,4,'#7cae5f');
}
function drawTree(o){
  ellipse(o.x,o.y+o.r+4,40,8,'rgba(0,0,0,0.3)');
  ctx.fillStyle='#6b4a2c';ctx.fillRect(o.x-8,o.y-26,16,30);
  ellipse(o.x,o.y-36,36,32,'#2f5c1f');
  ellipse(o.x-12,o.y-42,24,20,'#3a6f28');
  ellipse(o.x+12,o.y-30,22,20,'#2a4f1a');
  ellipse(o.x,o.y-50,11,8,'#4d8a34');
}
function drawPillar(o){
  ellipse(o.x,o.y+o.r+4,32,7,'rgba(0,0,0,0.3)');
  ctx.fillStyle='#7e8188';ctx.fillRect(o.x-14,o.y-56,28,60);
  ctx.fillStyle='#90949b';ctx.fillRect(o.x-12,o.y-56,24,6);
  ctx.fillStyle='#5f6269';ctx.fillRect(o.x-12,o.y-14,24,6);
  ctx.fillStyle='#4f6e3a';ctx.fillRect(o.x-14,o.y-30,5,12);ctx.fillRect(o.x+9,o.y-42,5,12);
  ellipse(o.x+11,o.y-24,4,6,'#3c5330');
}
function drawTorchStand(t){
  ctx.fillStyle='#5a4630';ctx.fillRect(t.x-3,t.y-6,6,54);
  ctx.fillStyle='#5a4630';ctx.fillRect(t.x-9,t.y-14,18,10);
  var fl=0.7+Math.sin(G.time*11+t.x)*0.3;
  ellipse(t.x,t.y-20-((1-fl)*4),10*fl,16*fl,'#ff8c1e');
  ellipse(t.x,t.y-20-((1-fl)*4),6*fl,11*fl,'#ffe35a');
  ellipse(t.x,t.y-20-((1-fl)*4),3*fl,5*fl,'#fff9c0');
  ellipse(t.x,t.y-4,13,4,'rgba(0,0,0,0.3)');
}
function drawObstacle(o){
  if(o.type==='tomb')drawTomb(o);
  else if(o.type==='tree')drawTree(o);
  else drawPillar(o);
}

/* =================== МОНЕТЫ И ОРУЖИЕ =================== */
function drawCoin(c){
  var wob=Math.abs(Math.sin(c.t*4));
  var s=c.v>40?9:7;
  ellipse(c.x,c.y+3,14,5,'rgba(0,0,0,0.3)');
  ctx.save();ctx.translate(c.x,c.y);
  ctx.save();ctx.scale(1,wob*0.6+0.3);ctx.fillStyle='#f5c542';
  ctx.beginPath();ctx.arc(0,0,s,0,TAU);ctx.fill();ctx.restore();
  ctx.fillStyle='#ffe98a';ellipse(-2,-3,4,2.5,'#ffe98a');
  ctx.fillStyle='#b8860b';ellipse(0,0,5,3.5,'#b8860b');
  ctx.restore();
}
function drawPickup(pk){
  var bob=Math.sin(pk.t*3)*4;
  ellipse(pk.x,pk.y+6,16,5,'rgba(0,0,0,0.3)');
  ctx.save();ctx.translate(pk.x,pk.y-14+bob);
  ctx.save();ctx.rotate(-0.7);
  ctx.fillStyle='#e8ecf2';ctx.fillRect(-26,-2.5,40,5);
  ctx.fillStyle='#fff';ctx.fillRect(-26,-2.5,40,2);
  ctx.fillStyle='#b8860b';rounded(-9,-8,8,16,2);
  ctx.restore();
  ctx.fillStyle='#e5c84d';ctx.beginPath();ctx.arc(0,-2,5,0,TAU);ctx.fill();
  ctx.restore();
  if(pk.p1)txt('H  меч',pk.x,pk.y-46,16,pk.hi1?'#ffd94d':'#ffffffa0','center');
  if(pk.p2)txt('ю  меч',pk.x,pk.y-28,16,pk.hi2?'#ffd94d':'#ffffffa0','center');
}

/* =================== ВОРОТА =================== */
function drawGate(){
  var g=G.gate,gy=WORLD_H/2;
  ctx.fillStyle='#6f747b';
  ctx.fillRect(g.x-100,gy-130,30,300);
  ctx.fillRect(g.x+70,gy-130,30,300);
  ctx.fillRect(g.x-100,gy-150,200,40);
  ctx.fillStyle='#8a8f96';ctx.fillRect(g.x-96,gy-146,192,18);
  ctx.fillStyle='#555b62';
  for(var yy=gy-138;yy<gy+160;yy+=22){ctx.fillRect(g.x-100,yy+4,30,3);ctx.fillRect(g.x+70,yy+4,30,3);}
  ctx.fillStyle='#14161a';rounded(g.x-58,gy-88,116,190,58);
  var yoff=Math.floor((1-g.raise)*170);
  ctx.fillStyle='#3a3f45';
  for(var i=0;i<6;i++)ctx.fillRect(g.x-50+i*20,gy-120+yoff,8,190);
  ctx.fillRect(g.x-58,gy-122+yoff,116,10);

function hitMonster(m,dmg,kx,ky){
  if(m.hp<=0)return;
  m.hp-=dmg;m.flash=0.1;m.kx=(m.kx||0)+kx;m.ky=(m.ky||0)+ky;
  addFloat(m.x,m.y-46,'-'+Math.max(0,Math.round(dmg)),'#ffe15a');
  SND.hit();
  if(m.hp<=0){
    m.dying=true;m.deadT=0.55;G.kills++;
    var cols=m===G.boss?['#8fce5a','#7cc05a','#ffd54d']:(m.type==='knight'?['#5b6f3a','#8fae6a','#ff3b30']:['#e6e2d2','#fff','#c0c6cf']);
    burst(m.x,m.y-20,14,cols,170,3,120,0.6);
    if(m!==G.boss&&m.type==='knight')G.pickups.push({x:m.x,y:m.y,tier:Math.min(1+G.level,8),taken:false,t:0,p1:false,p2:false,hi1:false,hi2:false});
  }
}
function hurtPlayer(p,raw){
  if(p.inv>0||p.down)return;
  var dmg=raw,red=armorRed(p.armorTier);
  if(p.blocking){red=Math.min(0.85,red+blockResist(p));SND.block();}
  dmg=Math.max(1,Math.round(dmg*(1-red)));
  p.hp-=dmg;p.inv=0.55;p.flash=0.14;G.shake=Math.max(G.shake,0.14);
  addFloat(p.x,p.y-64,'-'+dmg,'#ff7766');
  if(!p.blocking)SND.hit();
  if(p.hp<=0){
    p.hp=0;p.down=true;p.downT=0;p.reviveT=0;p.blocking=false;
    burst(p.x,p.y-20,10,['#c0392b','#e05555','#ffb0b0'],120,3,60,0.6);
    SND.dead();checkBothDown();
  }
}
function checkBothDown(){
  if(P().down&&P2().down){G.state='gameover';G.gameOverReason='Оба рыцаря пали в бою!';SND.dead();}
}
function doSwingHit(p){
  var rng=68,dmg=pwDamage(p);
  var fx=Math.cos(p.aim||0),fy=Math.sin(p.aim||0);
  for(var i=0;i<G.monsters.length;i++){
    var m=G.monsters[i];
    if(m.dying)continue;
    var dx=m.x-p.x,dy=m.y-p.y,d=Math.max(1,Math.hypot(dx,dy));
    if(d<rng&&(dx*fx+dy*fy)>d*0.3)hitMonster(m,dmg,fx*90,fy*90);
  }
  var b=G.boss;
  if(b&&!b.dead){
    var bx=b.x-p.x,by=b.y-p.y,bd=Math.max(1,Math.hypot(bx,by));
    if(bd<rng+30&&(bx*fx+by*fy)>bd*0.3)hitMonster(b,dmg,fx*90,fy*90);
  }
}

/* =================== ОБНОВЛЕНИЕ ИГРОКОВ =================== */
function moveCollide(e,r){
  e.x=clamp(e.x,44+r,WORLD_W-44-r);
  e.y=clamp(e.y,56+r,WORLD_H-44-r);
  for(var i=0;i<G.obstacles.length;i++){
    var o=G.obstacles[i];
    var dx=e.x-o.x,dy=e.y-o.y,d=Math.hypot(dx,dy),min=o.r+r;
    if(d<min&&d>0.001){e.x=o.x+dx/d*min;e.y=o.y+dy/d*min;}
  }
}
function updatePlayers(dt){
  for(var i=0;i<G.players.length;i++){
    var p=G.players[i];
    if(p.inv>0)p.inv-=dt;
    if(p.flash>0)p.flash-=dt;
    if(p.swingT<1)p.swingT+=dt/0.30;
    if(p.down){
      p.downT+=dt;
      var ally=G.players[1-p.id];
      if(!ally.down&&xdist(ally.x,ally.y,p.x,p.y)<85){
        p.reviveT+=dt;
        if(p.reviveT>=1.4){
          p.down=false;p.hp=Math.round(p.maxHp*0.45);p.inv=1.5;p.reviveT=0;
          addFloat(p.x,p.y-80,'ВОСКРЕШЕНИЕ!','#7fff7f');SND.potion();
        }
      }else p.reviveT=Math.max(0,p.reviveT-dt);
      continue;
    }
    var dx=0,dy=0;
    if(p.id===0){if(held(K.W))dy--;if(held(K.S))dy++;if(held(K.A))dx--;if(held(K.D))dx++;}
    else{if(held(K.UP))dy--;if(held(K.DOWN))dy++;if(held(K.LEFT))dx--;if(held(K.RIGHT))dx++;}
    var L=Math.hypot(dx,dy);
    if(L>0){dx/=L;dy/=L;p.moving=true;p.walk+=dt*8;p.aim=Math.atan2(dy,dx);}
    else p.moving=false;
    p.x+=dx*p.speed*dt;p.y+=dy*p.speed*dt;
    moveCollide(p,20);
    if(p.moving&&Math.abs(dx)>=Math.abs(dy))p.dir=dx>0?1:-1;
    var atkCode=p.id===0?K.F:K.PATT;
    if(held(atkCode)&&p.swingT>=1){p.swingT=0;p.hitDone=false;SND.swing();}
    var blkCode=p.id===0?K.G:K.PBLK;
    p.blocking=held(blkCode);
    if(!p.hitDone&&p.swingT>=0.34){p.hitDone=true;doSwingHit(p);}
  }
}
function updateMonsters(dt){
  for(var i=0;i<G.monsters.length;i++){
    var m=G.monsters[i];
    if(m.flash>0)m.flash-=dt;
    if(m.dying){m.deadT-=dt;continue;}
    m.cd-=dt;m.st-=dt;
    if(m.kx||m.ky){m.x+=m.kx*dt;m.y+=m.ky*dt;m.kx*=0.85;m.ky*=0.85;}
    var t=null,bd=1e9;
    for(var pi=0;pi<G.players.length;pi++){
      var pp=G.players[pi];
      if(pp.down)continue;
      var dd=xdist(pp.x,pp.y,m.x,m.y);
      if(dd<bd){bd=dd;t=pp;}
    }
    if(m.state==='idle'){if(m.st<=0)m.state='chase';continue;}
    if(!t){continue;}
    var dx=t.x-m.x,dy=t.y-m.y,d=Math.max(1,bd);
    m.moving=false;
    if(m.type==='knight'){
      if(m.state==='windup'){
        m.wind=Math.min(1,m.wind+dt*2.6);
        if(m.st<=0){
          m.state='chase';m.cd=m.cdMax;m.wind=0;G.shake=Math.max(G.shake,0.1);
          for(var q=0;q<G.players.length;q++){
            var ps=G.players[q];
            if(!ps.down&&xdist(m.x,m.y,ps.x,ps.y)<m.range+8)hurtPlayer(ps,m.dmg);
          }
          SND.swing();
        }
      }else{
        if(d<m.range-4&&m.cd<=0){m.state='windup';m.st=0.4;m.wind=0;}
        else{m.x+=dx/d*m.speed*dt;m.y+=dy/d*m.speed*dt;m.moving=true;m.walk+=dt*7;}
      }
    }else{
      if(m.state==='windup'){
        m.wind=Math.min(1,m.wind+dt*3);
        if(m.st<=0){m.state='chase';m.cd=m.cdMax;m.wind=0;shootBone(m,t);}
      }else{
        if(d>305){m.x+=dx/d*m.speed*dt;m.y+=dy/d*m.speed*dt;m.moving=true;m.walk+=dt*7;}
        else if(d<225){m.x-=dx/d*m.speed*dt;m.y-=dy/d*m.speed*dt;m.moving=true;m.walk+=dt*7;}
        else if(m.cd<=0){m.state='windup';m.st=0.3;m.wind=0;m.aim={x:t.x,y:t.y-20};}
      }
    }
    if(Math.abs(dx)>Math.abs(dy)+14)m.face=dx>0?1:-1;
    for(var j=0;j<G.monsters.length;j++){
      var o=G.monsters[j];
      if(o===m||o.dying)continue;
      var d2=xdist(m.x,m.y,o.x,o.y);
      if(d2<32&&d2>0.5){m.x+=(m.x-o.x)/d2*26*dt;m.y+=(m.y-o.y)/d2*26*dt;}
    }
    moveCollide(m,16);
  }
  G.monsters=G.monsters.filter(function(mm){return !(mm.dying&&mm.deadT<=0);});
}
/* =================== БОСС =================== */
function shootBone(m,t){
  var sp=340,dx=t.x-m.x,dy=t.y-m.y,d=Math.hypot(dx,dy)||1;
  G.projectiles.push({x:m.x,y:m.y-30,vx:dx/d*sp,vy:dy/d*sp,owner:'m',dmg:m.dmg,life:2.4,kind:'bone'});
  SND.swing();
}
function updateBoss(dt){
  var b=G.boss;
  if(!b)return;
  if(b.flash>0)b.flash-=dt;
  if(b.dead){
    b.deadT+=dt;
    burst(b.x,b.y-30,Math.min(30,Math.floor(b.deadT*14)),['#ffd54d','#ff8c1e','#ff3b30','#8fce5a'],200,4,80,0.8);
    if(b.deadT>2&&G.boss){
      G.boss=null;G.cleared=true;G.gateOpen=true;
      G.banner='ШРЕК ПОВЕРЖЕН! Войдите в замок!';G.bannerTimer=3;SND.fanfare();
    }
    return;
  }
  b.cd-=dt;b.bombCd-=dt;
  if(!b.rage&&b.hp<b.maxHp*0.5){
    b.rage=true;b.speed=112;b.cdMax=1.05;
    G.banner='ШРЕК В ЯРОСТИ!';G.bannerTimer=2.4;G.shake=0.3;
    burst(b.x,b.y-30,36,['#ff5522','#ffaa00','#ff2a2a'],200,4,60,0.9);
    SND.roar();
  }
  var t=null,bd=1e9;
  for(var pi=0;pi<G.players.length;pi++){
    var pp=G.players[pi];
    if(pp.down)continue;
    var dd=xdist(pp.x,pp.y,b.x,b.y);
    if(dd<bd){bd=dd;t=pp;}
  }
  if(t){
    var dx=t.x-b.x,dy=t.y-b.y,d=Math.max(1,bd);
    if(Math.abs(dx)>Math.abs(dy)+24)b.face=dx>0?1:-1;
    if(b.state==='windup'){
      b.wind=Math.min(1,b.wind+dt*2);
      if(b.st<=0){b.state='chase';b.cd=b.cdMax;b.wind=0;bossSmash(b);}
    }else{
      if(d<135&&b.cd<=0){b.state='windup';b.st=0.55;b.wind=0;}
      else{b.x+=dx/d*b.speed*dt;b.y+=dy/d*b.speed*dt;b.walk+=dt*3;}
    }
    if(b.bombCd<=0&&bd<640){b.bombCd=4.5;throwBomb(b,t);}
  }
  moveCollide(b,38);
}
function bossSmash(b){
  G.shake=0.35;SND.hit();
  burst(b.x,b.y-30,30,['#c9a227','#8a5a1f','#ffd54d','#6b4a2a'],240,4,70,0.8);
  for(var i=0;i<G.players.length;i++){
    var p=G.players[i];
    if(p.down)continue;
    var d=xdist(b.x,b.y,p.x,p.y);
    if(d<150)hurtPlayer(p,Math.round(b.dmg*(d<85?1.35:1)));
  }
}
function throwBomb(b,t){
  var sp=250,dx=t.x-b.x,dy=t.y-b.y,d=Math.hypot(dx,dy)||1;
  G.projectiles.push({x:b.x,y:b.y-80,vx:dx/d*sp,vy:dy/d*sp,owner:'boss',dmg:20,life:1.8,kind:'bomb'});
  SND.swing();
}
function updateProjectiles(dt){
  var keep=[];
  for(var i=0;i<G.projectiles.length;i++){
    var pr=G.projectiles[i];
    pr.life-=dt;pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;
    var dead=pr.life<=0;
    if(pr.owner==='m'||pr.owner==='boss'){
      for(var j=0;j<G.players.length;j++){
        var p=G.players[j];
        if(p.down)continue;
        if(xdist(p.x,p.y-28,pr.x,pr.y)<24){
          if(pr.kind==='bomb'){if(!pr.boom){pr.boom=true;bombBoom(pr);}}
          else hurtPlayer(p,pr.dmg);
          dead=true;break;
        }
      }
    }
    if(pr.kind==='bomb'&&!pr.boom&&pr.life<=0){pr.boom=true;bombBoom(pr);}
    if(!dead)keep.push(pr);
  }
  G.projectiles=keep;
}
function bombBoom(pr){
  G.shake=Math.max(G.shake,0.24);SND.bomb();
  burst(pr.x,pr.y,46,['#ff5500','#ffd54d','#ff8811','#ffff88'],250,4,90,0.9);
  for(var i=0;i<G.players.length;i++){
    var p=G.players[i];
    if(!p.down&&xdist(p.x,p.y,pr.x,pr.y)<95)hurtPlayer(p,pr.dmg);
  }
}
/* =================== МОНЕТЫ / ПОДБОР / ЧАСТИЦЫ =================== */
function updateCoins(dt){
  for(var i=0;i<G.coins.length;i++){
    var c=G.coins[i];
    if(c.taken)continue;
    c.t+=dt;
    for(var j=0;j<G.players.length;j++){
      var p=G.players[j];
      if(p.down)continue;
      if(xdist(p.x,p.y,c.x,c.y)<30){
        c.taken=true;p.levelCoins+=c.v;G.collectedCoins+=c.v;
        addFloat(c.x,c.y-20,'+'+c.v,'#ffe15a');
        SND.coin();burst(c.x,c.y,5,['#ffe15a','#f5c542'],90,2,20,0.4);
        break;
      }
    }
  }
  G.coins=G.coins.filter(function(c){return !c.taken;});
}
function updatePickups(dt){
  for(var i=0;i<G.pickups.length;i++){
    var pk=G.pickups[i];
    if(pk.taken)continue;
    pk.t+=dt;
    var p1=P(),p2=P2();
    pk.p1=!p1.down&&xdist(p1.x,p1.y,pk.x,pk.y)<60;
    pk.p2=!p2.down&&xdist(p2.x,p2.y,pk.x,pk.y)<60;
    pk.hi1=pk.p1;pk.hi2=pk.p2;
    if(pk.p1&&took(K.H))pickupWeapon(p1,pk);
    if(pk.p2&&!pk.taken&&took(K.PPICK))pickupWeapon(p2,pk);
  }
  G.pickups=G.pickups.filter(function(pk){return !pk.taken;});
}
function pickupWeapon(p,pk){
  pk.taken=true;
  if(p.weaponTier< pk.tier)p.weaponTier=pk.tier;
  else if(p.weaponTier<10)p.weaponTier++;
  addFloat(pk.x,pk.y-34,'УРОН МЕЧА: '+pwDamage(p),'#cfe8ff');
  SND.pickup();
  burst(pk.x,pk.y,12,['#cfe8ff','#fff','#e5c84d'],120,2,40,0.5);
}
function updateParticles(dt){
  var keep=[];
  for(var i=0;i<G.particles.length;i++){
    var pt=G.particles[i];
    pt.life-=dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=(pt.grav||0)*dt;
    if(pt.life>0)keep.push(pt);
  }
  G.particles=keep;
}
function updateFloaters(dt){
  var keep=[];
  for(var i=0;i<G.floaters.length;i++){
    var f=G.floaters[i];
    f.life-=dt;f.y-=30*dt;
    if(f.life>0)keep.push(f);
  }
  G.floaters=keep;
}

/* =================== ВОРОТА И КАЗНА =================== */
function updateGate(dt){
  var g=G.gate;if(!g)return;
  var allDead=G.monsters.length===0&&(!G.boss||G.boss.dead);
  if(!G.isBoss&&!G.cleared&&allDead){
    G.cleared=true;G.gateOpen=true;
    G.banner='Монстры убиты! Внесите плату в ворота!';G.bannerTimer=2.8;
  }
  if(G.isBoss&&!G.cleared&&allDead&&G.boss===null){
    G.cleared=true;G.gateOpen=true;
    G.banner='Ворота замка открыты! Войдите внутрь!';G.bannerTimer=3;
  }
  if(G.gateOpen&&g.raise<1)g.raise=Math.min(1,g.raise+dt*1.5);
  if(!G.isBoss&&G.cleared&&!G.tollShown){
    for(var i=0;i<G.players.length;i++){
      var p=G.players[i];
      if(!p.down&&xdist(p.x,p.y,g.x,g.y)<90){G.tollShown=true;startToll();break;}
    }
  }
  if(G.isBoss&&G.cleared&&G.boss===null){
    for(var j=0;j<G.players.length;j++){
      var pp=G.players[j];
      if(!pp.down&&xdist(pp.x,pp.y,g.x,g.y)<100){
        G.state='ending';G.ending={t:0,conf:[]};
        SND.fanfare();break;
      }
    }
  }
}
function startToll(){
  G.toll=Math.round(G.totalLevelCoins*TOLL_RATE);
  G.tollCollected=P().levelCoins+P2().levelCoins;
  G.tollTimer=5;
  G.state='toll';
  SND.error();
}
function updateToll(dt){
  G.tollTimer-=dt;
  if(took(K.ENTER)||G.tollTimer<=0){
    if(G.tollCollected>=G.toll){
      var left=G.tollCollected-G.toll;
      G.purse+=left;G.nextPurse=left;
      for(var i=0;i<G.players.length;i++){
        G.players[i].down=false;G.players[i].reviveT=0;G.players[i].hp=G.players[i].maxHp;
      }
      SND.pay();
      G.state='shop';openShop();
    }else{
      G.state='gameover';
      G.gameOverReason='Страж ворот казнил рыцарей: плата 60% не внесена!';
      SND.dead();
    }
  }
}
function updateCamera(dt){
  var cx=(P().x+P2().x)/2,cy=(P().y+P2().y)/2;
  G.cam.x=lerp(G.cam.x,clamp(cx-W/2,0,WORLD_W-W),Math.min(1,dt*6));
  G.cam.y=lerp(G.cam.y,clamp(cy-H/2,0,WORLD_H-H),Math.min(1,dt*6));
}
function updateWorld(dt){
  updatePlayers(dt);
  updateMonsters(dt);
  updateBoss(dt);
  updateProjectiles(dt);
  updateCoins(dt);
  updatePickups(dt);
  updateParticles(dt);
  updateFloaters(dt);
  updateGate(dt);
  updateCamera(dt);
  if(G.shake>0)G.shake-=dt*1.6;
}
/* =================== МАГАЗИН =================== */
function computeShop(){
  var p1=P(),p2=P2(),it=[];
  if(p1.weaponTier<10)it.push({n:'Меч мастера · Рыцарь 1',d:'Урон: '+pwDamage(p1)+' → '+(pwDamage(p1)+5),p:40+18*p1.weaponTier,buy:function(){p1.weaponTier++;},dis:false});
  else it.push({n:'Меч МАКС · Рыцарь 1',d:'Максимальный урон: '+pwDamage(p1),p:0,buy:null,dis:true});
  if(p2.weaponTier<10)it.push({n:'Меч мастера · Рыцарь 2',d:'Урон: '+pwDamage(p2)+' → '+(pwDamage(p2)+5),p:40+18*p2.weaponTier,buy:function(){p2.weaponTier++;},dis:false});
  else it.push({n:'Меч МАКС · Рыцарь 2',d:'Максимальный урон: '+pwDamage(p2),p:0,buy:null,dis:true});
  if(p1.armorTier<4){
    var nt1=p1.armorTier+1;
    it.push({n:'Броня ур.'+nt1+' · Рыцарь 1',d:'+'+armorBonus(nt1)+' HP, −'+Math.round(armorRed(nt1)*100)+'% урона',p:50+35*p1.armorTier,buy:function(){p1.armorTier++;},dis:false});
  }else it.push({n:'Броня МАКС · Рыцарь 1',d:'Максимальная защита',p:0,buy:null,dis:true});
  if(p2.armorTier<4){
    var nt2=p2.armorTier+1;
    it.push({n:'Броня ур.'+nt2+' · Рыцарь 2',d:'+'+armorBonus(nt2)+' HP, −'+Math.round(armorRed(nt2)*100)+'% урона',p:50+35*p2.armorTier,buy:function(){p2.armorTier++;},dis:false});
  }else it.push({n:'Броня МАКС · Рыцарь 2',d:'Максимальная защита',p:0,buy:null,dis:true});
  if(p1.shieldTier<3){
    var cur1=Math.round(blockResist(p1)*100),nxt1=Math.min(80,Math.round((blockResist(p1)+0.08)*100));
    it.push({n:'Щит ур.'+(p1.shieldTier+1)+' · Рыцарь 1',d:'Блок: −'+cur1+'% → −'+nxt1+'% урона',p:55+28*p1.shieldTier,buy:function(){p1.shieldTier++;},dis:false});
  }else it.push({n:'Щит МАКС · Рыцарь 1',d:'Максимальный блок',p:0,buy:null,dis:true});
  if(p2.shieldTier<3){
    var cur2=Math.round(blockResist(p2)*100),nxt2=Math.min(80,Math.round((blockResist(p2)+0.08)*100));
    it.push({n:'Щит ур.'+(p2.shieldTier+1)+' · Рыцарь 2',d:'Блок: −'+cur2+'% → −'+nxt2+'% урона',p:55+28*p2.shieldTier,buy:function(){p2.shieldTier++;},dis:false});
  }else it.push({n:'Щит МАКС · Рыцарь 2',d:'Максимальный блок',p:0,buy:null,dis:true});
  it.push({n:'Зелье · Рыцарь 1',d:'Полное исцеление ('+p1.hp+'/'+p1.maxHp+')',p:30,buy:function(){p1.hp=p1.maxHp;},dis:p1.hp>=p1.maxHp});
  it.push({n:'Зелье · Рыцарь 2',d:'Полное исцеление ('+p2.hp+'/'+p2.maxHp+')',p:30,buy:function(){p2.hp=p2.maxHp;},dis:p2.hp>=p2.maxHp});
  return it;
}
function openShop(){
  G.shopItems=computeShop();G.shopMsg='';G.shopRects=[];G.shopContRect=null;
}
function updateShop(dt){
  var km=[K.K1,K.K2,K.K3,K.K4,K.K5,K.K6,K.K7,K.K8];
  for(var i=0;i<km.length;i++){if(took(km[i]))buyItem(i);}
  if(took(K.ENTER))shopContinue();
  if(mclick){
    mclick=false;
    if(G.shopContRect&&mx>G.shopContRect[0]&&mx<G.shopContRect[0]+G.shopContRect[2]&&my>G.shopContRect[1]&&my<G.shopContRect[1]+G.shopContRect[3]){shopContinue();return;}
    for(var j=0;j<G.shopRects.length;j++){
      var r=G.shopRects[j];
      if(mx>r[0]&&mx<r[0]+r[2]&&my>r[1]&&my<r[1]+r[3]){buyItem(j);return;}
    }
  }
}
function buyItem(idx){
  var it=G.shopItems[idx];
  if(!it)return;
  if(it.dis){SND.error();G.shopMsg=it.d;return;}
  if(G.purse<it.p){SND.error();G.shopMsg='Не хватает монет!';return;}
  G.purse-=it.p;it.buy();G.shopMsg='Куплено: '+it.n;SND.buy();
  syncMaxHp(P());syncMaxHp(P2());
  G.shopItems=computeShop();G.shopRects=[];
}
function shopContinue(){
  G.nextPurse=0;
  if(G.level>=REGULAR_LEVELS)startLevel(G.level+1,true);
  else startLevel(G.level+1,false);
}

/* =================== КОНЦОВКА =================== */
function updateEnding(dt){
  var E=G.ending;E.t+=dt;
  if(E.t>12.2&&(E.t-(E.lastConf||0))>0.09){
    E.lastConf=E.t;
    var cols2=['#ffd54d','#ff8a6a','#8fce5a','#7fd0ff'];
    for(var i=0;i<4;i++)E.conf.push({x:rand(0,W),y:-12,vx:rand(-40,40),vy:rand(80,180),col:cols2[irand(0,3)],r:rand(4,9)});
  }
  if(E.conf){
    for(var j=0;j<E.conf.length;j++){
      var c=E.conf[j];
      c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=160*dt;c.a=(c.a||1)-dt*0.22;
    }
    E.conf=E.conf.filter(function(c){return c.a>0&&c.y<H+20;});
  }
  if(E.t>16.2&&took(K.ENTER))G=null;
}
function drawEndingScene(){
  var E=G.ending,t=E.t;
  if(t<4.6)drawExteriorEnding(t);
  else drawThroneEnding(t);
  if(E.conf){
    for(var i=0;i<E.conf.length;i++){
      var c=E.conf[i];
      ctx.fillStyle=c.col;
      ctx.globalAlpha=clamp(c.a||1,0,1);
      ctx.fillRect(c.x,c.y,c.r,c.r);
    }
    ctx.globalAlpha=1;
  }
  if(t>16.2)drawVictoryPanel();
}
function drawExteriorEnding(t){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b0f22');g.addColorStop(0.6,'#1a1430');g.addColorStop(1,'#0a0c14');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ellipse(W/2,300,280,120,'#0a0e1c');
  ellipse(W/2-300,420,160,60,'#121830');
  var gx=W/2,gy=500;
  ctx.fillStyle='#4a5060';
  ctx.fillRect(gx-150,gy-220,44,260);ctx.fillRect(gx+106,gy-220,44,260);
  ctx.fillRect(gx-150,gy-250,300,44);
  ctx.fillStyle='#5c6272';
  for(var i=0;i<6;i++)ctx.fillRect(gx-150+i*50,gy-266,30,18);
  ctx.fillStyle='#8a92a4';
  ctx.fillRect(gx-146,gy-246,140,20);
  ctx.fillStyle='#14161a';rounded(gx-86,gy-130,172,200,60);
  var p1x=lerp(-120,640,ease(clamp(t/2.4,0,1)));
  var p2x=p1x-80;
  var walkP=t<3;
  drawKnight(p1x,660,1,{body:'#3d6fd8',trim:'#2b52a8',plume:'#ffd94d',plume2:'#d89f2a',skin:'#f0c4a0',blocking:false,swing:1,moving:walkP,walk:t*6,down:false,flash:0});
  drawKnight(p2x,660,1,{body:'#d8484a',trim:'#a2323a',plume:'#7fe0ff',plume2:'#4fb6c9',skin:'#e8b088',blocking:false,swing:1,moving:walkP,walk:t*6+1,down:false,flash:0});
  txt('Врата замка открыты для героев!',W/2,150,36,'#ffd54d','center',6);
  txt('Под воротами — тёмный зал, где их ждёт король...',W/2,205,22,'#cfe0f0','center',3);
  var al=clamp((t-3.6)/0.8,0,1);
  ctx.fillStyle='rgba(8,10,18,'+al+')';ctx.fillRect(0,0,W,H);
}
function drawThroneEnding(t){

  drawKnight(p2x,640,1,{body:'#d8484a',trim:'#a2323a',plume:'#7fe0ff',plume2:'#4fb6c9',skin:'#e8b088',blocking:false,swing:1,moving:!kneel&&t<8.6,walk:t*6+1,down:kneel,flash:0});
  if(t>7.5&&t<=9)txt('Рыцари преклоняют колено перед королём...',W/2,120,28,'#dfe7f0','center',4);
  if(t>12.2){
    var c1t=ease(clamp((t-12.2)/1.4,0,1));
    drawCrown(lerp(W-230,560,c1t),lerp(560,600,c1t),14*(1-c1t*0.3),'#ffd54d');
    if(t>13){var c2t=ease(clamp((t-13)/1.4,0,1));drawCrown(lerp(W-230,430,c2t),lerp(540,600,c2t),14*(1-c2t*0.3),'#ffd54d');}
  }
  if(t>12){
    var a1=clamp((t-12)/0.8,0,1);
    txt('Король: «Вы спасли королевство от Шрека и его нежити!»',W/2,200,26,'rgba(255,235,190,'+a1+')','center',4);
  }
  if(t>13.6){
    var a2=clamp((t-13.6)/0.8,0,1);
    txt('Вам даруются Высшие Рыцарские Чины!',W/2,246,30,'rgba(255,213,77,'+a2+')','center',5);
    txt('ЗАЩИТНИКИ КОРОЛЕВСТВА',W/2,288,40,'rgba(255,213,77,'+a2+')','center',6);

}
/* =================== ДЕМО-БОТ (для теста ?demo) =================== */
function moveKey(i,dx,dy){
  var kh;
  if(i===0)kh={W:K.W,S:K.S,A:K.A,D:K.D};
  else kh={W:K.UP,S:K.DOWN,A:K.LEFT,D:K.RIGHT};
  keys[kh.W]=dy<0;keys[kh.S]=dy>0;keys[kh.A]=dx<0;keys[kh.D]=dx>0;
}
function demoBot(dt){
  if(G.state==='shop'){
    if(G.demoShopT===undefined)G.demoShopT=0;
    G.demoShopT+=dt;
    if(!G.demoBought){
      for(var s=0;s<G.shopItems.length;s++){
        var si=G.shopItems[s];
        if(!si.dis&&G.purse>=si.p){buyItem(s);G.demoBought=true;break;}
      }
    }
    if(G.demoShopT>1.5)presses.push(K.ENTER);
    return;
  }
  if(G.state==='toll'||G.state==='banner'||G.state==='ending'||G.state==='gameover')return;
  for(var i=0;i<G.players.length;i++){
    var p=G.players[i];
    if(p.down)continue;
    var best=null,bd=1e9;
    for(var j=0;j<G.monsters.length;j++){
      var m=G.monsters[j];if(m.dying)continue;
      var d=xdist(m.x,m.y,p.x,p.y);
      if(d<bd){bd=d;best={type:'m',o:m};}
    }
    var b=G.boss;
    if(b&&!b.dead){var db=xdist(b.x,b.y,p.x,p.y);if(db<bd){bd=db;best={type:'m',o:b};}}
    if(best&&bd>150){
      for(var k=0;k<G.pickups.length;k++){
        var pk=G.pickups[k];if(pk.taken)continue;
        var dp=xdist(pk.x,pk.y,p.x,p.y);
        if(dp<90){best={type:'p',o:pk};bd=dp;break;}
      }
    }
    if(!best){
      for(var c2=0;c2<G.coins.length;c2++){
        var co=G.coins[c2];if(co.taken)continue;
        var dc=xdist(co.x,co.y,p.x,p.y);
        if(dc<bd){bd=dc;best={type:'c',o:co};}
      }
    }
    var tx=G.gate?G.gate.x:W/2,ty=G.gate?G.gate.y:H/2;
    if(best){tx=best.o.x;ty=best.o.y;}
    else if(G.cleared&&G.gate){tx=G.gate.x;ty=G.gate.y;}
    var dxs=tx-p.x,dys=ty-p.y;
    moveKey(i,dxs>12?1:(dxs<-12?-1:0),dys>12?1:(dys<-12?-1:0));
    var atk=p.id===0?K.F:K.PATT;
    if(best&&best.type==='m'&&bd<100)keys[atk]=true;else keys[atk]=false;
    if(best&&best.type==='p'&&bd<64)presses.push(p.id===0?K.H:K.PPICK);
  }
}
function demoStart(){
  newGame();startLevel(1,false);
  G.demo=true;
  P().weaponTier=5;P2().weaponTier=5;
  P().armorTier=2;P2().armorTier=2;
  P().shieldTier=1;P2().shieldTier=1;
  syncMaxHp(P());syncMaxHp(P2());
}
/* =================== ГЛАВНЫЙ ЦИКЛ =================== */
function update(dt){
  if(!G){
    if(took(K.ENTER))newGame(),startLevel(1,false);
    else if(DEMO)demoStart();
    return;
  }
  if(G.demo&&(G.state==='playing'||G.state==='boss'))demoBot(dt);
  G.time+=dt;
  if(G.bannerTimer>0)G.bannerTimer-=dt;
  switch(G.state){
    case 'banner':
      G.stateTimer-=dt;
      if(G.stateTimer<=0||took(K.ENTER))G.state=G.isBoss?'boss':'playing';
      break;
    case 'playing':
    case 'boss':
      if(took(K.ESC))G.paused=!G.paused;
      if(G.paused){if(took(K.ENTER))G.paused=false;break;}
      updateWorld(dt);
      break;
    case 'toll':updateToll(dt);break;
    case 'shop':updateShop(dt);break;
    case 'ending':updateEnding(dt);break;
    case 'gameover':if(took(K.ENTER))G=null;break;
  }
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#05070f';ctx.fillRect(0,0,W,H);
  if(!G){drawMenu();return;}
  switch(G.state){
    case 'banner':drawWorldScene();drawBanner();break;
    case 'playing':
    case 'boss':drawWorldScene();drawHUD();if(G.paused)drawPause();break;
    case 'toll':drawWorldScene();drawToll();break;
    case 'shop':drawWorldScene();drawShop();break;
    case 'ending':drawEndingScene();break;
    case 'gameover':drawWorldScene();drawGameOver();break;
  }
}
var lastT=performance.now();
function loop(now){
  var dt=Math.min(DT_MAX,(now-lastT)/1000);lastT=now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
